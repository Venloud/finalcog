<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101417">
  <meta name="referrer" content="no-referrer">
  <title>TikTok connection | Final Cog</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--ink:#101417;--paper:#f1f3f4;--muted:#aab3b8;--quiet:#818b91;--line:#394247;--accent:#25f4ee}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background-color:var(--ink);background-image:repeating-linear-gradient(0deg,transparent 0 79px,#f1f3f405 80px),repeating-linear-gradient(90deg,transparent 0 79px,#f1f3f405 80px);color:var(--paper);font:400 14px/1.7 Manrope,Arial,sans-serif}
    main{width:min(560px,100%);padding:clamp(24px,6vw,48px);border:1px solid var(--line);background:#101417}
    .brand{display:flex;align-items:center;gap:9px;color:var(--paper);font:600 17px/1 Space Grotesk,Arial,sans-serif;letter-spacing:-.06em}
    .brand svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:5}
    h1{margin:42px 0 12px;font:600 clamp(34px,8vw,50px)/1.05 Space Grotesk,Arial,sans-serif;letter-spacing:-.07em}
    p{color:var(--muted);font-size:13px}
    .status{padding:14px 16px;margin:24px 0;border-left:2px solid var(--accent);background:#171d21}
    .button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 17px;border:1px solid var(--line);background:transparent;color:var(--paper);font:600 12px Manrope,Arial,sans-serif;cursor:pointer}
    .button:hover{border-color:var(--accent)}
    .button-primary{border-color:var(--accent);background:var(--accent);color:var(--ink)}
    .button-primary:hover{background:#bafbf8}
    .legacy-code{padding-top:18px;border-top:1px solid var(--line-soft,#2b3338)}
    code{display:block;max-height:120px;overflow:auto;overflow-wrap:anywhere;padding:12px;margin:10px 0 14px;border:1px solid var(--line);color:var(--paper);font:11px/1.6 Space Grotesk,monospace}
    footer{display:flex;gap:18px;flex-wrap:wrap;margin-top:40px;font-size:10px}
    a{color:var(--muted);text-underline-offset:4px}
    a:hover{color:var(--accent)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="index.html" aria-label="Final Cog home">
      <svg viewBox="0 0 200 200" aria-hidden="true"><path d="M84 22 87 6H113L116 22 125 25 137 13 159 26 154 43 161 50 178 46 191 68 179 80 182 88 198 92V117L181 120 178 129 190 142 177 164 160 159 153 166 157 183 135 196 123 183 114 186 111 199H86L83 183 74 180 61 192 39 179 44 162 37 155 20 159 7 137 20 125 17 116 1 113V87L18 84 21 75 9 63 22 41 39 46 46 39 42 22 64 9 76 22Z"/><circle cx="100" cy="103" r="55"/></svg>
      <span>Final Cog<span style="color:#25f4ee">.</span></span>
    </a>
    <h1 id="title">TikTok connection</h1>
    <p class="status" id="msg">Checking the sign-in response…</p>
    <button class="button button-primary" id="continue" hidden>Continue to Final Cog</button>
    <div class="legacy-code" id="legacy-code" hidden>
      <p>This response is for an older callback flow. Copy the full callback address for that integration.</p>
      <code id="url"></code>
      <button class="button" id="copy">Copy callback address</button>
    </div>
    <footer><a href="index.html">Final Cog home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></footer>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const state = query.get("state") || "";
    const localFlow = /^fc1_(\d{1,5})_([A-Za-z0-9_-]{40,50})$/.exec(state);
    const port = localFlow ? Number(localFlow[1]) : 0;
    const title = document.getElementById("title");
    const message = document.getElementById("msg");
    const continueButton = document.getElementById("continue");
    const legacyBlock = document.getElementById("legacy-code");

    if (localFlow && Number.isInteger(port) && port >= 1 && port <= 65535 && (query.has("code") || query.has("error"))) {
      const callback = new URL(`http://localhost:${port}/auth/tiktok/callback`);
      callback.searchParams.set("state", state);
      if (query.has("code")) callback.searchParams.set("code", query.get("code"));
      else callback.searchParams.set("error", "access_denied");
      history.replaceState(null, "", location.pathname);
      document.title = "Return to Final Cog";
      title.textContent = "Return to Final Cog";
      message.textContent = "TikTok has finished the sign-in step. Continue on this computer to complete the connection.";
      continueButton.hidden = false;
      continueButton.addEventListener("click", () => location.assign(callback.toString()));
    } else if (query.has("code") || query.has("error")) {
      title.textContent = "Legacy TikTok response";
      message.textContent = query.has("code")
        ? "TikTok returned an authorization response. Use the older integration's callback instructions to continue."
        : "The older TikTok connection was cancelled or failed. Return to that integration and try again.";
      if (query.has("code")) {
        legacyBlock.hidden = false;
        const address = location.href;
        document.getElementById("url").textContent = address;
        document.getElementById("copy").addEventListener("click", async event => {
          try {
            await navigator.clipboard.writeText(address);
            event.currentTarget.textContent = "Copied";
          } catch {
            event.currentTarget.textContent = "Copy unavailable";
          }
        });
      }
    } else {
      message.textContent = "Start sign-in from the Final Cog workspace. TikTok returns here to hand the response back to your local app.";
    }
  </script>
</body>
</html>
