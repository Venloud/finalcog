<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101417">
  <meta name="description" content="Batch finished videos into a paced TikTok inbox queue.">
  <title>Final Cog — Video queue</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/fonts.css">
  <link rel="stylesheet" href="../assets/gear-system.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <symbol id="icon-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="icon-library" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="icon-accounts" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 3.3-6 8-6s7.4 2 8 6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a href="#queue" class="brand" aria-label="Final Cog home">
        <span class="brand-mark gear-mark brand-gear" data-cog data-teeth="12"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="../assets/gear-system.svg#gear-12"/></svg><span class="gear-hub"></span></span>
        <span>Final Cog<span class="brand-period">.</span></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="primary-nav" id="primary-nav">
        <button class="nav-item active" data-view="queue"><svg><use href="#icon-queue"/></svg><span>Queue</span><span class="nav-count" id="queue-count" hidden></span></button>
        <button class="nav-item" data-view="calendar"><svg><use href="#icon-calendar"/></svg><span>Calendar</span></button>
        <button class="nav-item" data-view="library"><svg><use href="#icon-library"/></svg><span>Library</span></button>
      </nav>
      <div class="side-rule"></div>
      <div class="side-label">CHANNEL</div>
      <div class="channel-line"><span class="tiktok-mark" aria-hidden="true">T</span><span>TikTok</span><span class="channel-state" id="channel-state">Not connected</span></div>
      <div class="side-rule"></div>
      <nav class="primary-nav">
        <button class="nav-item" data-view="accounts"><svg><use href="#icon-accounts"/></svg><span>Accounts</span></button>
        <button class="nav-item" data-view="settings"><svg><use href="#icon-settings"/></svg><span>Settings</span></button>
      </nav>
      <div class="sidebar-foot"><span class="foot-indicator"></span><span>Local workspace</span><span class="version">FC / 01</span></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="crumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-title">Queue</strong></div>
        <div class="topbar-actions">
          <span class="topbar-machine" aria-hidden="true">
            <span class="gear-mark compact" data-cog data-teeth="6" data-direction="-1" data-phase="30"><svg viewBox="0 0 24 24"><use href="../assets/gear-system.svg#gear-6"/></svg></span>
            <span class="gear-mark compact" data-cog data-teeth="12"><svg viewBox="0 0 48 48"><use href="../assets/gear-system.svg#gear-12"/></svg></span>
          </span>
          <span class="account-chip" id="account-chip"><span class="account-dot"></span><span>Not connected</span></span>
          <a class="button button-accent button-small" href="/auth/tiktok/start" id="connect-top"><span>Sign in with TikTok</span><svg><use href="#icon-arrow"/></svg></a>
          <button class="icon-button mobile-menu" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-nav" id="mobile-menu"><svg><use href="#icon-menu"/></svg></button>
        </div>
      </header>
      <div class="server-notice" id="server-notice" role="status" hidden></div>
      <section id="view" class="view-content" aria-live="polite"></section>
      <footer class="app-footer"><span>Final Cog</span><span>Videos are sent to TikTok inbox drafts. Finish publishing inside TikTok.</span></footer>
    </main>
  </div>
  <dialog id="dialog" class="dialog">
    <form method="dialog" class="dialog-dismiss"><button class="dialog-x" aria-label="Close dialog" value="cancel"><svg><use href="#icon-close"/></svg></button></form>
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="../assets/gear-system.js"></script>
  <script src="./app.js"></script>
</body>
</html>
